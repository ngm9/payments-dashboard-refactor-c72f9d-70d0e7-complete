<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utkrusht Payments Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #f7f7fb;
      color: #222;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    header p {
      margin: 0;
      color: #666;
      font-size: 0.9rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .filters label {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
      color: #444;
    }

    .filters input[type="date"] {
      padding: 4px 8px;
      font-size: 0.9rem;
    }

    .filters button {
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 4px;
      border: 1px solid #2f64c2;
      background-color: #2f64c2;
      color: #fff;
      cursor: pointer;
    }

    .filters button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .banner {
      display: none;
      margin-bottom: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .banner--error {
      background-color: #fdecea;
      color: #611a15;
      border: 1px solid #f5c2c0;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .panel {
      background-color: #fff;
      border-radius: 6px;
      border: 1px solid #e1e1ee;
      padding: 14px 16px;
      box-shadow: 0 1px 2px rgba(18, 18, 30, 0.06);
      min-height: 120px;
    }

    .panel__title {
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .panel__body {
      font-size: 0.9rem;
    }

    .loading {
      font-size: 0.9rem;
      color: #666;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.88rem;
    }

    .summary-row span:last-child {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Payments Dashboard</h1>
      <p>Review daily and monthly payments generated by assessments on Utkrusht.</p>
    </header>

    <section class="filters" aria-label="Filters">
      <label>
        Start date
        <input type="date" id="start-date" />
      </label>
      <label>
        End date
        <input type="date" id="end-date" />
      </label>
      <button id="refresh-btn">Refresh</button>
    </section>

    <div id="error-banner" class="banner banner--error" role="alert" aria-live="polite"></div>

    <section id="dashboard" class="dashboard" aria-live="polite">
      <article class="panel" id="daily-panel">
        <h2 class="panel__title">Daily Payments</h2>
        <div class="panel__body" id="daily-content">
          <div class="loading">No data loaded yet.</div>
        </div>
      </article>
      <article class="panel" id="monthly-panel">
        <h2 class="panel__title">Monthly Payments</h2>
        <div class="panel__body" id="monthly-content">
          <div class="loading">No data loaded yet.</div>
        </div>
      </article>
    </section>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
